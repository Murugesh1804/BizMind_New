<!DOCTYPE html>
<html class="light" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Analyzing... - BizMind</title>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='css/images/fav.png') }}">
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />

    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#135bec",
                        "background-light": "#f8f9fb",
                        "background-dark": "#0a0a0b",
                    },
                    fontFamily: {
                        "display": ["Manrope", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "1rem",
                        "xl": "1.5rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>

    <style type="text/tailwindcss">
        @keyframes spinner-draw {
            0% {
                stroke-dashoffset: 280;
                transform: rotate(0deg);
            }

            50% {
                stroke-dashoffset: 75;
                transform: rotate(180deg);
            }

            100% {
                stroke-dashoffset: 280;
                transform: rotate(360deg);
            }
        }

        .animate-spinner {
            animation: spinner-draw 2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
            transform-origin: center;
        }

        .loading-dots:after {
            content: '.';
            animation: dots 1.5s steps(5, end) infinite;
        }

        @keyframes dots {
            0%,
            20% {
                content: '.';
            }

            40% {
                content: '..';
            }

            60% {
                content: '...';
            }

            80%,
            100% {
                content: '';
            }
        }
    </style>
</head>

<body
    class="bg-background-light dark:bg-background-dark font-display text-[#111318] dark:text-white transition-colors duration-300">
    <div class="relative flex h-screen w-full flex-col overflow-x-hidden">
        <div class="layout-container flex h-full grow flex-col">
            <main class="flex-1 flex flex-col items-center justify-center px-6 max-w-4xl mx-auto w-full -mt-16">
                <div class="relative mb-10 flex items-center justify-center">
                    <div class="absolute inset-0 bg-primary/10 blur-[60px] rounded-full scale-150"></div>
                    <svg class="w-24 h-24 md:w-28 md:h-28 relative z-10" viewBox="0 0 100 100">
                        <circle class="text-gray-200/50 dark:text-gray-800/50" cx="50" cy="50" fill="none" r="45"
                            stroke="currentColor" stroke-width="6"></circle>
                        <circle class="text-primary animate-spinner" cx="50" cy="50" fill="none" r="45"
                            stroke="currentColor" stroke-dasharray="283" stroke-linecap="round" stroke-width="6"
                            style="stroke-dashoffset: 210;"></circle>
                    </svg>
                </div>

                <div class="text-center max-w-md">
                    <h1 class="text-2xl md:text-3xl font-extrabold mb-4 tracking-tight text-gray-900 dark:text-white">
                        Analyzing Your Business Location
                    </h1>
                    <p class="text-gray-500 dark:text-gray-400 text-base md:text-lg font-medium leading-relaxed">
                        Fetching market data and competitor insights<span class="loading-dots"></span>
                    </p>
                </div>

                <div class="mt-10 w-full max-w-sm">
                    <div class="space-y-3">
                        <!-- Step 1: Geocoding -->
                        <div id="step-1"
                            class="flex items-center gap-3 text-gray-400 dark:text-gray-500 transition-all duration-500">
                            <div class="size-6 rounded-full border-2 border-current flex items-center justify-center">
                                <span class="material-symbols-outlined text-[14px] opacity-0 step-icon">check</span>
                            </div>
                            <span class="text-sm font-bold tracking-wide">Locating & Geocoding</span>
                        </div>

                        <!-- Step 2: Competitor Data -->
                        <div id="step-2"
                            class="flex items-center gap-3 text-gray-400 dark:text-gray-500 transition-all duration-500">
                            <div class="size-6 rounded-full border-2 border-current flex items-center justify-center">
                                <span class="material-symbols-outlined text-[14px] opacity-0 step-icon">check</span>
                            </div>
                            <span class="text-sm font-bold tracking-wide">Fetching Market Data</span>
                        </div>

                        <!-- Step 3: Feature Engineering -->
                        <div id="step-3"
                            class="flex items-center gap-3 text-gray-400 dark:text-gray-500 transition-all duration-500">
                            <div class="size-6 rounded-full border-2 border-current flex items-center justify-center">
                                <span class="material-symbols-outlined text-[14px] opacity-0 step-icon">check</span>
                            </div>
                            <span class="text-sm font-bold tracking-wide">Analyzing Competitors</span>
                        </div>

                        <!-- Step 4: AI Insights -->
                        <div id="step-4"
                            class="flex items-center gap-3 text-gray-400 dark:text-gray-500 transition-all duration-500">
                            <div class="size-6 rounded-full border-2 border-current flex items-center justify-center">
                                <span class="material-symbols-outlined text-[14px] opacity-0 step-icon">check</span>
                            </div>
                            <span class="text-sm font-bold tracking-wide">Generating AI Strategies</span>
                        </div>
                    </div>
                </div>
            </main>

            <div class="fixed bottom-12 left-1/2 -translate-x-1/2 opacity-20 pointer-events-none">
                <p class="text-[10px] uppercase tracking-[0.4em] font-bold text-gray-500">Secure Neural Processing</p>
            </div>
        </div>
    </div>

    <!-- Loading Animation Script -->
    <script>
        // Auto-submit analysis when page loads
        document.addEventListener('DOMContentLoaded', async function () {
            // Get form data from sessionStorage
            const formDataStr = sessionStorage.getItem('analysisFormData');

            if (!formDataStr) {
                // No form data, redirect back to home
                window.location.href = '/';
                return;
            }

            const formDataObj = JSON.parse(formDataStr);
            const token = localStorage.getItem('token');

            if (!token) {
                // No token, redirect to login
                sessionStorage.removeItem('analysisFormData');
                window.location.href = '/login';
                return;
            }

            // Simulate progress steps
            const steps = [
                { id: 'step-1', delay: 500 },   // Geocoding
                { id: 'step-2', delay: 2500 },  // Fetching Data
                { id: 'step-3', delay: 6000 },  // Analyzing
                { id: 'step-4', delay: 9000 }   // AI Generation
            ];

            const activateStep = (stepId) => {
                const el = document.getElementById(stepId);
                if (el) {
                    el.classList.remove('text-gray-400', 'dark:text-gray-500');
                    el.classList.add('text-primary', 'scale-105');
                    el.querySelector('.size-6').classList.add('bg-primary', 'text-white', 'border-primary');
                    // Reset others to completed style if needed, but for now just highlight active
                }
            };

            const completeStep = (stepId) => {
                const el = document.getElementById(stepId);
                if (el) {
                    el.classList.remove('scale-105');
                    el.classList.add('text-gray-900', 'dark:text-white');
                    el.querySelector('.step-icon').classList.remove('opacity-0');
                }
            }

            // Start animation sequence
            steps.forEach((step, index) => {
                setTimeout(() => {
                    // Complete previous if exists
                    if (index > 0) completeStep(steps[index - 1].id);
                    // Activate current
                    activateStep(step.id);
                }, step.delay);
            });

            // Create FormData object
            const formData = new FormData();
            for (const key in formDataObj) {
                formData.append(key, formDataObj[key]);
            }

            try {
                const response = await fetch('/analyze', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    },
                    body: formData
                });

                // Clear the stored form data
                sessionStorage.removeItem('analysisFormData');

                if (response.status === 401) {
                    // Token expired
                    localStorage.removeItem('token');
                    localStorage.removeItem('user');
                    alert('Session expired. Please login again.');
                    window.location.href = '/login';
                    return;
                }

                if (response.ok) {
                    // Get the HTML response
                    const html = await response.text();
                    // Replace current page with dashboard
                    document.open();
                    document.write(html);
                    document.close();
                } else {
                    const data = await response.json();
                    alert(data.message || 'Analysis failed. Please try again.');
                    window.location.href = '/';
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Network error. Please try again.');
                window.location.href = '/';
            }
        });
    </script>
</body>

</html>
