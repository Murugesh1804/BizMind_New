<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analyzing... - BizMind</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="loading-page">
    <div class="loading-container">
        <div class="text-center">
            <!-- Animated Icon -->
            <div class="loading-icon mb-4">
                <i class="fas fa-brain fa-5x text-primary"></i>
            </div>

            <!-- Loading Text -->
            <h2 class="mb-3">Analyzing Your Business Location</h2>
            <p class="text-muted mb-4">Please wait while we gather insights...</p>

            <!-- Progress Steps -->
            <div class="loading-steps">
                <div class="step active">
                    <i class="fas fa-map-marker-alt"></i>
                    <span>Fetching Location Data</span>
                </div>
                <div class="step">
                    <i class="fas fa-users"></i>
                    <span>Analyzing Competitors</span>
                </div>
                <div class="step">
                    <i class="fas fa-comments"></i>
                    <span>Processing Reviews</span>
                </div>
                <div class="step">
                    <i class="fas fa-robot"></i>
                    <span>Generating AI Insights</span>
                </div>
            </div>

            <!-- Spinner -->
            <div class="spinner-border text-primary mt-4" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Loading Animation Script -->
    <script>
        // Animate loading steps
        const steps = document.querySelectorAll('.step');
        let currentStep = 0;

        setInterval(() => {
            steps[currentStep].classList.remove('active');
            currentStep = (currentStep + 1) % steps.length;
            steps[currentStep].classList.add('active');
        }, 2000);
    </script>
</body>

</html>
