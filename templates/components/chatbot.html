<!-- bBot Mini Chatbot Component -->
<div id="bbot-container" class="fixed bottom-4 right-4 md:bottom-6 md:right-6 z-50">
    <!-- Chat Toggle Button -->
    <button id="bbot-toggle"
        class="bg-primary hover:bg-primary/90 text-white rounded-full p-3 md:p-4 shadow-2xl transition-all duration-300 hover:scale-110 flex items-center gap-2 group"
        aria-label="Toggle chatbot">
        <span class="material-symbols-outlined text-xl md:text-2xl">smart_toy</span>
        <span
            class="hidden md:block max-w-0 overflow-hidden group-hover:max-w-xs transition-all duration-300 whitespace-nowrap font-semibold">
            Ask bBot
        </span>
    </button>

    <!-- Chat Window -->
    <div id="bbot-window"
        class="hidden fixed inset-0 md:absolute md:inset-auto md:bottom-20 md:right-0 w-full md:w-96 h-[100dvh] md:h-[500px] bg-white dark:bg-gray-900 md:rounded-2xl shadow-2xl border-0 md:border border-gray-200 dark:border-gray-800 flex flex-col overflow-hidden z-[60]">

        <!-- Header -->
        <div class="bg-gradient-to-r from-primary to-blue-600 text-white p-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="bg-white/20 p-2 rounded-lg">
                    <span class="material-symbols-outlined text-xl">smart_toy</span>
                </div>
                <div>
                    <h3 class="font-bold text-lg">bBot</h3>
                    <p class="text-xs text-white/80">Your BizMind Assistant</p>
                </div>
            </div>
            <button id="bbot-close" class="hover:bg-white/20 p-2 rounded-lg transition-colors">
                <span class="material-symbols-outlined">close</span>
            </button>
        </div>

        <!-- Messages Container -->
        <div id="bbot-messages" class="flex-1 overflow-y-auto p-4 space-y-4 bg-gray-50 dark:bg-gray-950">
            <!-- Welcome Message -->
            <div class="flex gap-3 animate-fade-in">
                <div class="flex-shrink-0">
                    <div class="w-8 h-8 bg-primary/10 rounded-full flex items-center justify-center">
                        <span class="material-symbols-outlined text-primary text-sm">smart_toy</span>
                    </div>
                </div>
                <div class="flex-1">
                    <div class="bg-white dark:bg-gray-800 rounded-2xl rounded-tl-none p-3 shadow-sm">
                        <p class="text-sm text-gray-700 dark:text-gray-300">
                            Hi! I'm bBot, your BizMind assistant. I can help you with:
                        </p>
                        <ul class="text-xs text-gray-600 dark:text-gray-400 mt-2 space-y-1 ml-4 list-disc">
                            <li>Understanding your analysis results</li>
                            <li>Explaining business metrics</li>
                            <li>Answering questions about locations</li>
                            <li>General business advice</li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>

        <!-- Input Area -->
        <div class="p-4 bg-white dark:bg-gray-900 border-t border-gray-200 dark:border-gray-800">
            <form id="bbot-form" class="flex gap-2">
                <input type="text" id="bbot-input" placeholder="Ask me anything..."
                    class="flex-1 px-4 py-2 border border-gray-300 dark:border-gray-700 rounded-full focus:outline-none focus:ring-2 focus:ring-primary bg-gray-50 dark:bg-gray-800 text-gray-900 dark:text-white text-sm"
                    autocomplete="off" />
                <button type="submit" id="bbot-send"
                    class="bg-primary hover:bg-primary/90 text-white p-2 rounded-full transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
                    aria-label="Send message">
                    <span class="material-symbols-outlined">send</span>
                </button>
            </form>
            <p class="text-[10px] text-gray-400 dark:text-gray-600 mt-2 text-center">
                Powered by Groq AI
            </p>
        </div>
    </div>
</div>

<style>
    @keyframes fade-in {
        from {
            opacity: 0;
            transform: translateY(10px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .animate-fade-in {
        animation: fade-in 0.3s ease-out;
    }

    #bbot-messages::-webkit-scrollbar {
        width: 6px;
    }

    #bbot-messages::-webkit-scrollbar-track {
        background: transparent;
    }

    #bbot-messages::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 3px;
    }

    #bbot-messages::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
    }

    .dark #bbot-messages::-webkit-scrollbar-thumb {
        background: #475569;
    }

    .dark #bbot-messages::-webkit-scrollbar-thumb:hover {
        background: #64748b;
    }
</style>

<script>
    // bBot Chatbot Functionality
    (function () {
        const toggle = document.getElementById('bbot-toggle');
        const window = document.getElementById('bbot-window');
        const close = document.getElementById('bbot-close');
        const form = document.getElementById('bbot-form');
        const input = document.getElementById('bbot-input');
        const messages = document.getElementById('bbot-messages');
        const sendBtn = document.getElementById('bbot-send');

        let isOpen = false;

        // Toggle chat window
        function toggleChat() {
            isOpen = !isOpen;
            if (isOpen) {
                window.classList.remove('hidden');
                input.focus();
            } else {
                window.classList.add('hidden');
            }
        }

        toggle.addEventListener('click', toggleChat);
        close.addEventListener('click', toggleChat);

        // Add message to chat
        function addMessage(text, isUser = false) {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'flex gap-3 animate-fade-in';

            if (isUser) {
                messageDiv.innerHTML = `
                    <div class="flex-1"></div>
                    <div class="flex-shrink-0 max-w-[80%]">
                        <div class="bg-primary text-white rounded-2xl rounded-tr-none p-3 shadow-sm">
                            <p class="text-sm">${escapeHtml(text)}</p>
                        </div>
                    </div>
                `;
            } else {
                // Format bot message with markdown support
                const formattedText = formatMarkdown(text);
                messageDiv.innerHTML = `
                    <div class="flex-shrink-0">
                        <div class="w-8 h-8 bg-primary/10 rounded-full flex items-center justify-center">
                            <span class="material-symbols-outlined text-primary text-sm">smart_toy</span>
                        </div>
                    </div>
                    <div class="flex-1">
                        <div class="bg-white dark:bg-gray-800 rounded-2xl rounded-tl-none p-3 shadow-sm prose prose-sm max-w-none dark:prose-invert">
                            ${formattedText}
                        </div>
                    </div>
                `;
            }

            messages.appendChild(messageDiv);
            messages.scrollTop = messages.scrollHeight;
        }

        // Format markdown text to HTML
        function formatMarkdown(text) {
            let html = escapeHtml(text);

            // Headers (### Header)
            html = html.replace(/^### (.+)$/gm, '<h3 class="text-base font-bold text-gray-900 dark:text-white mt-3 mb-2">$1</h3>');
            html = html.replace(/^## (.+)$/gm, '<h2 class="text-lg font-bold text-gray-900 dark:text-white mt-3 mb-2">$1</h2>');
            html = html.replace(/^# (.+)$/gm, '<h1 class="text-xl font-bold text-gray-900 dark:text-white mt-3 mb-2">$1</h1>');

            // Bold text (**text** or __text__)
            html = html.replace(/\*\*(.+?)\*\*/g, '<strong class="font-bold text-gray-900 dark:text-white">$1</strong>');
            html = html.replace(/__(.+?)__/g, '<strong class="font-bold text-gray-900 dark:text-white">$1</strong>');

            // Italic text (*text* or _text_)
            html = html.replace(/\*(.+?)\*/g, '<em class="italic">$1</em>');
            html = html.replace(/_(.+?)_/g, '<em class="italic">$1</em>');

            // Inline code (`code`)
            html = html.replace(/`([^`]+)`/g, '<code class="px-1.5 py-0.5 bg-gray-100 dark:bg-gray-700 rounded text-xs font-mono text-primary">$1</code>');

            // Code blocks (```code```)
            html = html.replace(/```(\w+)?\n([\s\S]+?)```/g, function (match, lang, code) {
                return `<pre class="bg-gray-100 dark:bg-gray-700 p-3 rounded-lg mt-2 mb-2 overflow-x-auto"><code class="text-xs font-mono text-gray-800 dark:text-gray-200">${code.trim()}</code></pre>`;
            });

            // Tables (detect pipe-separated tables)
            html = html.replace(/^\|(.+)\|$/gm, function (match) {
                return '<table-row>' + match + '</table-row>';
            });

            // Convert table rows to actual table
            if (html.includes('<table-row>')) {
                const lines = html.split('\n');
                let tableHtml = '';
                let inTable = false;
                let isHeader = true;

                for (let i = 0; i < lines.length; i++) {
                    const line = lines[i].trim();

                    if (line.startsWith('<table-row>')) {
                        const row = line.replace('<table-row>|', '').replace('|</table-row>', '');
                        const cells = row.split('|').map(cell => cell.trim());

                        // Skip separator rows (---|---|---)
                        if (cells[0].match(/^-+$/)) {
                            isHeader = false;
                            continue;
                        }

                        if (!inTable) {
                            tableHtml += '<table class="min-w-full border-collapse mt-2 mb-2 text-xs"><tbody>';
                            inTable = true;
                        }

                        if (isHeader) {
                            tableHtml += '<tr class="bg-primary/10 dark:bg-primary/20">';
                            cells.forEach(cell => {
                                tableHtml += `<th class="border border-gray-300 dark:border-gray-600 px-3 py-2 text-left font-bold text-gray-900 dark:text-white">${cell}</th>`;
                            });
                            tableHtml += '</tr>';
                        } else {
                            tableHtml += '<tr class="hover:bg-gray-50 dark:hover:bg-gray-800">';
                            cells.forEach(cell => {
                                tableHtml += `<td class="border border-gray-300 dark:border-gray-600 px-3 py-2 text-gray-700 dark:text-gray-300">${cell}</td>`;
                            });
                            tableHtml += '</tr>';
                        }
                    } else {
                        if (inTable) {
                            tableHtml += '</tbody></table>';
                            inTable = false;
                            isHeader = true;
                        }
                        tableHtml += line + '\n';
                    }
                }

                if (inTable) {
                    tableHtml += '</tbody></table>';
                }

                html = tableHtml;
            }

            // Bullet lists (- item or * item)
            const lines = html.split('\n');
            let result = [];
            let inList = false;

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i];
                const trimmed = line.trim();

                // Check for bullet point
                if (trimmed.match(/^[-*]\s+(.+)/)) {
                    const content = trimmed.replace(/^[-*]\s+/, '');
                    if (!inList) {
                        result.push('<ul class="list-disc list-inside space-y-1 my-2 text-gray-700 dark:text-gray-300">');
                        inList = true;
                    }
                    result.push(`<li class="ml-2">${content}</li>`);
                }
                // Check for numbered list
                else if (trimmed.match(/^\d+\.\s+(.+)/)) {
                    const content = trimmed.replace(/^\d+\.\s+/, '');
                    if (!inList) {
                        result.push('<ol class="list-decimal list-inside space-y-1 my-2 text-gray-700 dark:text-gray-300">');
                        inList = 'ordered';
                    }
                    result.push(`<li class="ml-2">${content}</li>`);
                }
                else {
                    if (inList) {
                        result.push(inList === 'ordered' ? '</ol>' : '</ul>');
                        inList = false;
                    }
                    if (trimmed) {
                        result.push(`<p class="text-sm text-gray-700 dark:text-gray-300 my-1">${line}</p>`);
                    }
                }
            }

            if (inList) {
                result.push(inList === 'ordered' ? '</ol>' : '</ul>');
            }

            html = result.join('\n');

            // Links [text](url)
            html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" class="text-primary hover:underline">$1</a>');

            return html;
        }

        // Add typing indicator
        function showTyping() {
            const typingDiv = document.createElement('div');
            typingDiv.id = 'bbot-typing';
            typingDiv.className = 'flex gap-3 animate-fade-in';
            typingDiv.innerHTML = `
                <div class="flex-shrink-0">
                    <div class="w-8 h-8 bg-primary/10 rounded-full flex items-center justify-center">
                        <span class="material-symbols-outlined text-primary text-sm">smart_toy</span>
                    </div>
                </div>
                <div class="flex-1">
                    <div class="bg-white dark:bg-gray-800 rounded-2xl rounded-tl-none p-3 shadow-sm">
                        <div class="flex gap-1">
                            <div class="w-2 h-2 bg-gray-400 rounded-full animate-bounce" style="animation-delay: 0s"></div>
                            <div class="w-2 h-2 bg-gray-400 rounded-full animate-bounce" style="animation-delay: 0.2s"></div>
                            <div class="w-2 h-2 bg-gray-400 rounded-full animate-bounce" style="animation-delay: 0.4s"></div>
                        </div>
                    </div>
                </div>
            `;
            messages.appendChild(typingDiv);
            messages.scrollTop = messages.scrollHeight;
        }

        function removeTyping() {
            const typing = document.getElementById('bbot-typing');
            if (typing) typing.remove();
        }

        // Handle form submission
        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const message = input.value.trim();
            if (!message) return;

            // Add user message
            addMessage(message, true);
            input.value = '';
            sendBtn.disabled = true;

            // Show typing indicator
            showTyping();

            try {
                // Get token
                const token = localStorage.getItem('token');

                // Send to API
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': token ? `Bearer ${token}` : ''
                    },
                    body: JSON.stringify({ message })
                });

                removeTyping();

                if (response.ok) {
                    const data = await response.json();
                    addMessage(data.response);
                } else {
                    const error = await response.json();
                    addMessage(error.message || 'Sorry, I encountered an error. Please try again.');
                }
            } catch (error) {
                removeTyping();
                console.error('Chat error:', error);
                addMessage('Sorry, I\'m having trouble connecting. Please try again later.');
            } finally {
                sendBtn.disabled = false;
                input.focus();
            }
        });

        // Utility function to escape HTML
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    })();
</script>
